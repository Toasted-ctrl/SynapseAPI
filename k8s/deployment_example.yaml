apiVersion: apps/v1
kind: Deployment
metadata:
  name: artificial-intelligence-api
  namespace: artificial-intelligence-api
  labels:
    app: artificial-intelligence-api
    keel.sh/policy: major
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 1m"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: artificial-intelligence-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: artificial-intelligence-api
    spec:
      # Pull from private registry
      imagePullSecrets:
        - name: registry-credentials
      
      # Security best practices
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
        - name: artificial-intelligence-api
          image: "YOUR IMAGE REPOSITORY/artificial-intelligence-api:latest"
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          # Load config from ConfigMap
          envFrom:
            - configMapRef:
                name: artificial-intelligence-api-config
            - secretRef:
                name: artificial-intelligence-api-secret
          
          # Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          
          # Container security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          # Writable temp directory if needed
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /app/data
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          persistentVolumeClaim:
            claimName: artificial-intelligence-api-pvc