[project]
name = "synapse-api"
version = "0.5.42"
description = "SynapseAPI: an API that functions as a general gateway for multiple providers (e.g., Ollama, Anthropic)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "asyncpg>=0.31.0",
    "cachetools>=7.2.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "fastapi-cache2[redis]>=0.2.2",
    "google-auth>=2.56.2",
    "httpx2>=2.5.0",
    "jinja2>=3.1.6",
    "joserfc>=1.7.4",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.5.6",
    "langchain-google-genai>=4.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.15.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "ollama>=0.6.2",
    "openai>=2.53.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.13.0",
    "uvicorn>=0.51.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.17.2",
]
